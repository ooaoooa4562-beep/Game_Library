name: Game smoke tests
on:
  pull_request:
  push:
    branches: [classic-edition]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame-ce
      - run: python -m compileall -q .
      - run: python smoke_test.py
